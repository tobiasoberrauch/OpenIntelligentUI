services:
  # ── Agent (LangGraph Python) — native Python with FastAPI + uvicorn ──
  - type: web
    name: open-generative-ui-agent
    runtime: python
    plan: starter
    rootDir: apps/agent
    buildCommand: pip install uv && uv sync
    startCommand: uv run uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    scaling:
      minInstances: 1
      maxInstances: 3
      targetMemoryPercent: 80
      targetCPUPercent: 70
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
      - key: ANTHROPIC_API_KEY
        sync: false
      # OpenAI key for the default ChatGPT Instant model
      - key: OPENAI_API_KEY
        sync: false
      - key: LANGSMITH_API_KEY
        sync: false
      # chat-latest and gpt-* route via OpenAI, Claude names via Anthropic;
      # with LLM_BASE_URL any OpenAI-compatible server: then set LLM_MODEL to
      # the served model name (see apps/agent/src/model.py, docs/open-models.md)
      - key: LLM_MODEL
        value: chat-latest
      - key: LLM_BASE_URL
        sync: false
      - key: LLM_API_KEY
        sync: false
      # Visualization router: auto uses Jev when TYPESAFE_API_KEY is set,
      # otherwise an OpenAI-compatible model (the answer model endpoint by default)
      - key: ROUTER_BACKEND
        value: auto
      - key: TYPESAFE_API_KEY
        sync: false
      - key: JEV_MODEL
        value: jev-latest
      - key: ROUTER_BASE_URL
        sync: false
      - key: ROUTER_MODEL
        sync: false
      - key: ROUTER_API_KEY
        sync: false
    buildFilter:
      paths:
        - apps/agent/**

  # ── Frontend (Next.js) — native Node runtime ──
  - type: web
    name: open-generative-ui-app
    runtime: node
    plan: starter
    scaling:
      minInstances: 1
      maxInstances: 3
      targetMemoryPercent: 80
      targetCPUPercent: 70
    # turbo's build task dependsOn ^build, so @repo/design-system dist/ is built before the app
    buildCommand: corepack enable && pnpm install --no-frozen-lockfile && pnpm exec turbo run build --filter=@repo/app
    startCommand: pnpm --filter @repo/app start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Public origin used for social-preview metadata; existing hostname retained.
      - key: APP_URL
        value: https://opengenerativeui.copilotkit.ai
      - key: SKIP_INSTALL_DEPS
        value: "true"
      # Public demo: visitors bring their own OpenAI key. Remove for a private
      # deployment that uses the agent's server-side model. Build-time setting.
      - key: NEXT_PUBLIC_BYOK
        value: "true"
      - key: LANGGRAPH_DEPLOYMENT_URL
        fromService:
          name: open-generative-ui-agent
          type: web
          property: hostport
      - key: LANGSMITH_API_KEY
        sync: false
      - key: RATE_LIMIT_ENABLED
        value: "false"
      - key: RATE_LIMIT_WINDOW_MS
        value: "60000"
      - key: RATE_LIMIT_MAX
        value: "40"
    buildFilter:
      paths:
        - apps/app/**
        - packages/design-system/**
        - package.json
        - pnpm-lock.yaml
        - turbo.json
